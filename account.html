<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | Aphotech Solar Solution</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/auth-guard.js"></script>
  <style>
    .account-card{max-width:650px;margin:3rem auto;background:#fff;padding:2rem;border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.08)}
    .account-row{padding:1rem 0;border-bottom:1px solid #eee}.account-row:last-child{border-bottom:0}
    .account-label{font-size:.85rem;opacity:.65;margin-bottom:.25rem}.account-value{font-weight:600}
    .logout-btn{border:0;cursor:pointer;margin-top:1.5rem}
  </style>
</head>
<body>
<header><div class="navbar"><div class="logo"><img src="assets/images/logo.png" alt="Aphotech Solar Logo"><span>Aphotech Solar</span></div><nav class="nav-links"><a href="index.html">Home</a><a href="packages.html">Packages</a><a href="projects.html">Projects</a><a href="contact.html">Contact</a></nav></div></header>
<section class="section gray"><div class="container"><div class="account-card">
  <h1><i class="fa-solid fa-user"></i> My Account</h1>
  <p id="accountMessage">Loading your information...</p>
  <div id="profileData"></div>
  <button class="btn logout-btn" id="logoutBtn">Logout</button>
</div></div></section>
<script>
const SUPABASE_URL="https://xeyuuydojhlhpsdvkfcj.supabase.co";
const SUPABASE_KEY="sb_publishable_3AgCAUJYvcN4w7hSC3bS9Q_eR2VsIWN";
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
(async()=>{
  const {data:{user}}=await client.auth.getUser();
  if(!user) return;
  const {data:profile,error}=await client.from('profiles').select('full_name,phone,state,email,created_at').eq('id',user.id).single();
  const box=document.getElementById('profileData');
  const msg=document.getElementById('accountMessage');
  if(error){msg.textContent='Your account is active, but your profile details are not available yet. Please refresh and try again.';return;}
  msg.textContent='Welcome to your Aphotech customer account.';
  const rows=[['Full Name',profile.full_name||'Not provided'],['Phone / WhatsApp',profile.phone||'Not provided'],['State',profile.state||'Not provided'],['Email',profile.email||user.email||'Not provided'],['Privacy Consent',profile.privacy_consent?'Accepted':'Not recorded'],['Member Since',new Date(profile.created_at).toLocaleDateString()]];
  box.innerHTML=rows.map(([label,value])=>`<div class="account-row"><div class="account-label">${label}</div><div class="account-value">${String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</div></div>`).join('');
})();
document.getElementById('logoutBtn').addEventListener('click',async()=>{await client.auth.signOut();window.location.replace('auth.html');});
</script>
</body>
</html>
