<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | Aphotech Solar</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/mobile.css">
<style>
.account-card{max-width:650px;margin:3rem auto;background:#fff;padding:2rem;border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.08)}
.logout-btn{border:0;cursor:pointer;margin-top:1.5rem}
</style>
</head>
<body>
<header><div class="navbar">
<div class="logo"><img src="assets/images/logo.png" alt="Aphotech Solar Logo"><span>Aphotech Solar</span></div>
<nav class="nav-links"><a href="index.html">Home</a><a href="packages.html">Packages</a><a href="projects.html">Projects</a><a href="contact.html">Contact</a></nav>
</div></header>

<section class="section gray">
<div class="container">
<div class="account-card">
<h1>My Account</h1>
<p id="accountMessage">Loading your information...</p>
<div id="profileData"></div>
<button type="button" class="btn logout-btn" id="logoutBtn" onclick="forceLogout()">Logout</button>
</div>
</div>
</section>

<script>
/*
  EMERGENCY LOGOUT FIX
  This button intentionally does NOT wait for Supabase.
  It clears the browser's stored Supabase session immediately,
  then sends the visitor to the login page.
*/
function forceLogout() {
  var button = document.getElementById("logoutBtn");
  if (button) {
    button.disabled = true;
    button.textContent = "Logging out...";
  }

  try {
    localStorage.clear();
  } catch (e) {}

  try {
    sessionStorage.clear();
  } catch (e) {}

  window.location.replace("auth.html?loggedout=1&v=" + Date.now());
}
</script>
</body>
</html>
