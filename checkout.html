<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Aphotech Solar</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/mobile.css"><link rel="stylesheet" href="assets/css/store.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <link rel="stylesheet" href="assets/css/brand-refresh.css">
</head><body data-store-page="checkout"><main class="store-shell"><nav class="store-nav"><a class="secondary" href="cart.html">← Back to cart</a><a class="secondary" href="account.html">My account</a></nav><section class="store-hero"><h1>Secure checkout</h1><p>Enter your delivery details and choose how you want to pay.</p></section><div id="storeMessage" class="store-alert" hidden></div><div class="store-grid"><section class="store-panel"><h2>Customer & delivery details</h2><form id="checkoutForm"><div class="store-field"><label for="customerName">Full name</label><input id="customerName" required autocomplete="name"></div><div class="store-field"><label for="customerEmail">Email address</label><input id="customerEmail" type="email" required autocomplete="email"></div><div class="store-field"><label for="customerPhone">Phone / WhatsApp</label><input id="customerPhone" type="tel" required autocomplete="tel"></div><div class="store-field"><label for="deliveryAddress">Delivery address</label><textarea id="deliveryAddress" rows="3" required></textarea></div><div class="store-field"><label for="deliveryState">State</label><input id="deliveryState" required placeholder="e.g. Lagos"></div><div class="store-field"><label for="orderNotes">Additional instructions (optional)</label><textarea id="orderNotes" rows="2"></textarea></div><h2>Payment method</h2><label class="store-panel"><input type="radio" name="paymentMethod" value="bank_transfer" checked> <strong>Bank transfer — Moniepoint MFB</strong><p class="store-muted">Transfer after placing your order, then submit the transfer reference.</p></label><label class="store-panel"><input type="radio" name="paymentMethod" value="paystack" disabled> <strong>Pay online</strong> <span class="coming-soon">Coming soon</span><p class="store-muted">Online card and bank payments will be available in a future update.</p></label><button id="placeOrderBtn" class="store-btn" type="submit">Place order</button></form></section><aside class="store-panel"><h2>Order summary</h2><div id="checkoutSummary"></div><div class="store-total final"><span>Total</span><strong id="checkoutTotal">₦0</strong></div><p class="store-muted">No delivery fee is charged here. Any applicable delivery or installation fee will be confirmed by Aphotech.</p></aside></div></main><script src="assets/js/store.js"></script></body></html>
