<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Aphotech Solar Solution</title>
  <meta name="description" content="Reset your Aphotech Solar Solution account password.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/auth.css?v=20260811fp2">
</head>

<body>
<main class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <img src="assets/images/logo.png" alt="Aphotech Solar Solution">
      <h1>Aphotech</h1>
      <p>Solar Solution</p>
    </div>

    <section class="auth-form">
      <h2>Set New Password</h2>
      <p class="auth-subtitle">
        Enter a new password for your Aphotech account.
      </p>

      <label>New Password</label>
      <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input
          type="password"
          id="newPassword"
          placeholder="At least 6 characters"
          autocomplete="new-password"
        >
      </div>

      <label>Confirm New Password</label>
      <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Repeat your new password"
          autocomplete="new-password"
        >
      </div>

      <button type="button" class="auth-button" id="updateButton" onclick="updatePassword()">
        <i class="fa-solid fa-key"></i>
        Update Password
      </button>

      <p id="resetMessage" class="auth-message"></p>

      <div class="auth-switch">
        <button type="button" onclick="window.location.href='auth.html'">
          Back to Login
        </button>
      </div>
    </section>

    <p class="secure-note">
      <i class="fa-solid fa-shield-halved"></i>
      Your account information is securely protected.
    </p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://xeyuuydojhlhpsdvkfcj.supabase.co";
const SUPABASE_KEY = "sb_publishable_3AgCAUJYvcN4w7hSC3bS9Q_eR2VsIWN";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function updatePassword() {
  const password = document.getElementById("newPassword").value;
  const confirm = document.getElementById("confirmPassword").value;
  const message = document.getElementById("resetMessage");
  const button = document.getElementById("updateButton");

  message.className = "auth-message";

  if (password.length < 6) {
    message.classList.add("error");
    message.textContent = "Password must contain at least 6 characters.";
    return;
  }

  if (password !== confirm) {
    message.classList.add("error");
    message.textContent = "The passwords do not match.";
    return;
  }

  button.disabled = true;
  message.textContent = "Updating your password...";

  const { error } = await supabaseClient.auth.updateUser({
    password: password
  });

  if (error) {
    button.disabled = false;
    message.classList.add("error");
    message.textContent =
      error.message || "Unable to update your password.";
    console.error(error);
    return;
  }

  message.classList.add("success");
  message.textContent =
    "Password updated successfully. Returning to login...";

  await supabaseClient.auth.signOut();

  setTimeout(function () {
    window.location.replace("auth.html?reset=success");
  }, 1200);
}
</script>
</body>
</html>
